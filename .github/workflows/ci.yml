name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev,legacy]"

      - name: Build package
        run: python -m build

      - name: CLI contract
        run: serdes-lab --help

      - name: JS syntax check
        run: node --check labpro/static/app.js

      - name: Test suite
        run: python -m pytest tests -q

      - name: Physics selftest
        run: python -m serdes_sim.selftest

      - name: Legacy pages smoke test
        run: python smoke_test_pages.py
