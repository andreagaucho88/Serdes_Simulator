name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev,legacy]"

      - name: Build package
        # The dev extra installs the declared backend, so this also guards the
        # exact non-isolated command documented for contributors.
        run: python -m build --no-isolation

      - name: CLI contract
        run: serdes-lab --help

      - name: Python lint
        run: python -m ruff check .

      - name: JS syntax check
        run: node --check labpro/static/app.js

      - name: Test suite
        run: python -m pytest tests -q

      - name: Physics selftest
        run: python -m serdes_sim.selftest

      - name: Legacy pages smoke test
        run: python smoke_test_pages.py

  package-smoke:
    name: Package smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the package
        run: python -m pip install .

      - name: CLI contract
        run: serdes-lab --help

      - name: Packaged assets and version
        run: python -c "import importlib.resources as r, labpro, serdes_sim; assert labpro.__version__; assert r.files('labpro').joinpath('static/index.html').is_file(); assert r.files('serdes_sim').joinpath('data/golden/ieee_802_3bs_smf_2017/library.json').is_file()"
