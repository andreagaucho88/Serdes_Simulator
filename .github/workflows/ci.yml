name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: JS syntax check
        run: node --check labpro/static/app.js

      - name: Test suite
        run: python -m pytest tests -q

      - name: Physics selftest
        run: python -m serdes_sim.selftest

      - name: Legacy pages smoke test
        run: python smoke_test_pages.py
