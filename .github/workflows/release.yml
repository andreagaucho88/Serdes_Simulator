name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: python -m pip install build==1.2.2.post1

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c "import os, pathlib, tomllib; version=tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']; expected=f'v{version}'; assert os.environ['RELEASE_TAG'] == expected, f'tag {os.environ[\"RELEASE_TAG\"]} does not match {expected}'"

      - name: Build distributions
        run: python -m build

      - name: Inspect wheel
        run: python -m zipfile -l dist/*.whl

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
          fi

      - name: Keep distributions for the PyPI job
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  publish-pypi:
    # PyPI trusted publishing (OIDC): il progetto serdes-optical-lab su PyPI
    # accetta questo repository, questo workflow e l'environment "pypi";
    # nessun token o password nei secret.
    needs: build-and-release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/serdes-optical-lab/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
